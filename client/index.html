<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Resistance</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      canvas {
        display: block;
      }
      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        z-index: 100;
      }
      #fps {
        position: absolute;
        top: 10px;
        right: 10px;
        color: white;
        font-family: monospace;
        font-size: 14px;
        z-index: 100;
      }
      #crosshairs {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 20px;
        z-index: 100;
        pointer-events: none;
      }
      #crosshairs::before,
      #crosshairs::after {
        content: '';
        position: absolute;
        background-color: rgba(255, 255, 255, 0.8);
      }
      #crosshairs::before {
        top: 50%;
        left: 8px;
        width: 4px;
        height: 2px;
        transform: translateY(-50%);
      }
      #crosshairs::after {
        left: 50%;
        top: 8px;
        width: 2px;
        height: 4px;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div>The Resistance - FPS Game</div>
    </div>
    <div id="fps">FPS: 0</div>
    <div id="crosshairs"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
